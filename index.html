<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Для рижої киці 🦊</title>
<meta name="theme-color" content="#2a0f1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#2a0f1c;--bg2:#5c1a33;--pink:#ff5d8f;--rose:#ff9eb5;--ginger:#ff8a3d;--cream:#fff4ec;--ink:#2a0f1c;
  --beat:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg1);color:var(--cream);font-family:Rubik,system-ui,sans-serif}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg1) 70%)}
#bgPhotos{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.drift{position:absolute;width:110px;padding:6px 6px 22px;background:#fff;border-radius:4px;box-shadow:0 8px 24px #0006;opacity:.18;animation:drift linear infinite}
.drift img{width:100%;height:110px;object-fit:cover;display:block}
@keyframes drift{from{transform:translateY(110vh) rotate(var(--r))}to{transform:translateY(-40vh) rotate(calc(var(--r)*-1))}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.emo{position:absolute;font-size:28px;will-change:transform,opacity;animation:floatUp 3.2s ease-out forwards}
@keyframes floatUp{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-70vh) scale(1.2) rotate(var(--rot));opacity:0}}
.burst{position:absolute;font-size:30px;animation:burst 1.3s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot));opacity:0}}

#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(56px + env(safe-area-inset-top)) 16px calc(130px + env(safe-area-inset-bottom))}
#app>.card{margin:auto 0}
.card{width:100%;max-width:420px;background:#ffffff12;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff22;border-radius:26px;padding:22px 18px;text-align:center;box-shadow:0 20px 60px #0007;animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.out{animation:out .35s ease-in forwards}
@keyframes out{to{transform:scale(.85) translateY(-30px);opacity:0}}
h1,h2{font-family:Caveat,cursive;margin:.1em 0 .35em;line-height:1.05}
h1{font-size:44px}h2{font-size:32px}
.q-num{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
p{line-height:1.45;margin:.5em 0}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px;position:relative;min-height:56px}
button{font:600 17px Rubik,sans-serif;border:0;border-radius:999px;padding:14px 22px;cursor:pointer;color:var(--ink);background:var(--cream);box-shadow:0 6px 0 #0004;transition:transform .15s}
button:active{transform:translateY(3px);box-shadow:0 3px 0 #0004}
.yes{background:linear-gradient(135deg,var(--pink),var(--ginger));color:#fff}
.ghost{background:#ffffff22;color:var(--cream)}
.big{font-size:22px;padding:18px 34px}
.photo{width:100%;max-height:42vh;object-fit:cover;border-radius:18px;margin-top:12px;box-shadow:0 10px 30px #0008;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.polaroid{display:inline-block;background:#fff;padding:8px 8px 30px;border-radius:6px;transform:rotate(-3deg);box-shadow:0 12px 30px #0009;margin-top:12px;position:relative;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.polaroid img{display:block;width:min(62vw,230px);height:min(62vw,230px);object-fit:cover}
.polaroid span{position:absolute;bottom:4px;left:0;right:0;color:var(--ink);font:700 22px Caveat,cursive}
.react{font-family:Caveat,cursive;font-size:28px;margin-top:10px;animation:pop .5s}

/* top bar */
#top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
#hearts{font-size:15px;letter-spacing:2px}
#mute{background:#ffffff22;color:#fff;padding:8px 12px;font-size:16px;box-shadow:none}
/* captions */
#cap{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;text-align:center;padding:0 16px;pointer-events:none;min-height:60px}
#cap .line{display:inline-block;max-width:440px;background:#000a;padding:8px 14px;border-radius:14px;font:700 25px/1.15 Caveat,cursive;color:#fff}
#cap .w{opacity:.18;transition:opacity .25s,color .25s;display:inline-block}
#cap .w.on{opacity:1;color:var(--rose);animation:wordPop .35s}
@keyframes wordPop{50%{transform:translateY(-4px) scale(1.12)}}
.pulse{transform:scale(calc(1 + (var(--beat) - 1)));transition:transform .1s}
.heartbeat{display:inline-block;animation:hb .9s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.12)}}

/* countdown */
#count{font:700 160px Caveat,cursive;color:var(--rose);text-shadow:0 0 40px var(--pink)}
.tick{animation:tick 1s ease-out}
@keyframes tick{0%{transform:scale(2.2);opacity:0}30%{opacity:1}100%{transform:scale(.8);opacity:.2}}

/* fake errors */
.err{position:fixed;z-index:60;width:min(88vw,330px);background:#ece9d8;color:#000;border:2px solid #0a246a;border-radius:8px 8px 4px 4px;box-shadow:4px 6px 0 #0007;font:14px Tahoma,Verdana,sans-serif;animation:shake .4s}
.err .bar{background:linear-gradient(90deg,#0a246a,#3a6ea5);color:#fff;font-weight:700;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;border-radius:5px 5px 0 0}
.err .x{background:#d9442c;color:#fff;border-radius:3px;padding:0 7px;font:700 14px Tahoma;box-shadow:none;line-height:20px}
.err .body{padding:14px;display:flex;gap:12px;align-items:flex-start;text-align:left}
.err .ico{font-size:30px}
.err .ok{display:block;margin:0 auto 12px;border-radius:3px;padding:6px 28px;font:14px Tahoma;background:#fff;border:1px solid #333;box-shadow:none}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* slider */
input[type=range]{width:100%;margin:22px 0 6px;accent-color:var(--pink);height:30px}
#meterVal{font:700 64px Caveat,cursive;color:var(--rose)}

/* puzzle */
.puz{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:min(78vw,300px);margin:12px auto 0;aspect-ratio:3/4}
.tile{background-size:300% 300%;border-radius:4px;transition:transform .3s;cursor:pointer}
.puz.done{gap:0}.puz.done .tile{border-radius:0}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mc{aspect-ratio:3/4;perspective:600px;cursor:pointer}
.mc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.flip .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mc .f{background:linear-gradient(135deg,var(--pink),var(--ginger));display:flex;align-items:center;justify-content:center;font-size:26px}
.mc .b{transform:rotateY(180deg);background-size:cover;background-position:center}
.mc.ok .b{box-shadow:0 0 0 3px var(--rose)}

/* gift */
#gift{font-size:110px;cursor:pointer;display:inline-block;margin:10px 0}
.wob{animation:wob .5s}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg) scale(1.1)}75%{transform:rotate(15deg) scale(1.1)}}
.coupon{background:var(--cream);color:var(--ink);border:3px dashed var(--pink);border-radius:16px;padding:16px;margin-top:10px;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.coupon b{font:700 30px Caveat,cursive;display:block;color:var(--pink)}

/* kisses */
#kiss{font:700 72px Caveat,cursive;color:var(--rose)}

/* final */
.wall{position:relative;height:46vh;margin-top:8px}
.wall .polaroid{position:absolute;left:50%;top:50%;margin:0;transition:transform 1s cubic-bezier(.2,1.2,.3,1)}
.wall .polaroid img{width:min(42vw,170px);height:min(42vw,170px)}
.glitch{animation:glitch .5s steps(2) 3}
@keyframes glitch{0%{transform:translate(2px,-2px);filter:hue-rotate(90deg)}50%{transform:translate(-3px,2px);filter:invert(1)}100%{transform:none}}
#runNo{position:relative;transition:left .25s,top .25s}
small{opacity:.6}
</style>
</head>
<body>
<div id="bgPhotos"></div>
<div id="top"><div id="hearts"></div><button id="mute" style="display:none">🔊</button></div>
<main id="app"></main>
<div id="cap"></div>
<div id="fx"></div>
<audio id="song" src="song.mp3" preload="auto" loop></audio>

<script>
const $=s=>document.querySelector(s);
const app=$('#app'),fx=$('#fx'),song=$('#song');
const P=i=>`p${i}.jpg`;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- FX ---------- */
function floatEmoji(list=['❤️','💖','💕','🦊','✨','💗','🥰'],n=1){
  for(let i=0;i<n;i++){const e=document.createElement('div');e.className='emo';e.textContent=pick(list);
    e.style.left=rnd(2,92)+'vw';e.style.bottom='-40px';e.style.fontSize=rnd(20,40)+'px';
    e.style.setProperty('--dx',rnd(-60,60)+'px');e.style.setProperty('--rot',rnd(-60,60)+'deg');
    fx.appendChild(e);setTimeout(()=>e.remove(),3300);}
}
function burst(x,y,list=['❤️','💖','💕','😘','💋','✨'],n=26){
  if(x==null){x=innerWidth/2;y=innerHeight/2}
  for(let i=0;i<n;i++){const e=document.createElement('div');e.className='burst';e.textContent=pick(list);
    const a=Math.random()*Math.PI*2,d=rnd(90,Math.min(innerWidth,520)*.7);
    e.style.left=x+'px';e.style.top=y+'px';e.style.fontSize=rnd(18,40)+'px';
    e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d+'px');e.style.setProperty('--rot',rnd(-180,180)+'deg');
    fx.appendChild(e);setTimeout(()=>e.remove(),1400);}
}
const centerOf=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
function rain(list,ms=2500){const t=setInterval(()=>floatEmoji(list,3),120);setTimeout(()=>clearInterval(t),ms)}
function buzz(p=30){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* background polaroids */
(function(){const bg=$('#bgPhotos');for(let i=0;i<9;i++){const d=document.createElement('div');d.className='drift';
  d.innerHTML=`<img src="${P(i+1)}" alt="">`;d.style.left=(i*11+rnd(-3,3))+'vw';d.style.setProperty('--r',rnd(-20,20)+'deg');
  d.style.animationDuration=rnd(22,34)+'s';d.style.animationDelay=-rnd(0,30)+'s';bg.appendChild(d);}})();

/* ---------- progress ---------- */
let stepIdx=0;const TOTAL=10;
function hearts(){$('#hearts').textContent=Array.from({length:TOTAL},(_,i)=>i<stepIdx?'❤️':'🤍').join('')}

/* ---------- screen helper ---------- */
async function show(html,cls=''){
  const old=app.firstElementChild;if(old){old.classList.add('out');await sleep(300)}
  app.innerHTML=`<div class="card ${cls}">${html}</div>`;app.scrollTop=0;return app.firstElementChild;
}
function next(){stepIdx++;hearts();buzz(20);STEPS[stepIdx]()}
const nextBtn=(t='Далі →')=>`<div class="btns"><button class="yes" id="nx">${t}</button></div>`;
function wireNext(){$('#nx').onclick=next}

/* ---------- MUSIC: captions + beat ---------- */
// Власні субтитри (не текст пісні) — з'являються під музику слово за словом
const CAPS=[
 [5,'тсс... це пісня для тебе 🎧'],
 [12,'ти вже посміхаєшся? я бачу 😏'],
 [20,'ти — мій улюблений баг у коді 🐞'],
 [29,'який я ніколи не буду фіксити 💻❤️'],
 [38,'рижа, смішна і трохи вредна 🦊'],
 [47,'але моя ✨'],
 [55,'з тобою навіть шаурма смачніша 🌯'],
 [64,'а синій язик — то взагалі топ 👅💙'],
 [73,'я б і в 3 ночі дзвонив тобі по відео 📱'],
 [82,'просто щоб подивитись як ти засинаєш 😴'],
 [92,'ти — моя улюблена людина 🫶'],
 [101,'і моя улюблена звичка'],
 [110,'обійми мене, коли дочитаєш 🤗'],
 [119,'бо я вже скучив 🥺'],
 [128,'ти робиш звичайні дні особливими 🌸'],
 [138,'навіть понеділки 😳'],
 [147,'дякую, що ти є 💞'],
 [156,'і що терпиш мої приколи 🤡'],
 [165,'я вибираю тебе 🫵'],
 [173,'сьогодні, завтра і завжди ♾️'],
 [182,'тт 💋'],
 [190,'люблю тебе, киць ❤️'],
 [200,'...ну все, тепер тицяй далі 😌'],
];
const BEAT=0.45;let lastBeat=-1,capIdx=-1,capWords=[],capStart=0;
function renderCap(i){
  const [t,txt]=CAPS[i];const words=txt.split(' ');capStart=t;
  $('#cap').innerHTML=`<span class="line">${words.map(w=>`<span class="w">${w}</span>`).join(' ')}</span>`;
  capWords=[...$('#cap').querySelectorAll('.w')];
}
function loop(){
  if(!song.paused){
    const t=song.currentTime;
    // captions
    let ci=-1;for(let i=0;i<CAPS.length;i++)if(t>=CAPS[i][0])ci=i;
    if(ci!==capIdx){capIdx=ci;if(ci>=0)renderCap(ci);else $('#cap').innerHTML=''}
    if(ci>=0){const el=t-capStart;capWords.forEach((w,k)=>w.classList.toggle('on',el>k*BEAT*1.2))}
    // beat
    const b=Math.floor(t/BEAT);
    if(b!==lastBeat){lastBeat=b;document.documentElement.style.setProperty('--beat',b%2?1.0:1.06);
      if(b%2===0)floatEmoji(undefined,t>60&&t<100||t>140&&t<200?2:1);}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
$('#mute').onclick=()=>{song.muted=!song.muted;$('#mute').textContent=song.muted?'🔇':'🔊'};

/* ================= STEPS ================= */
const STEPS=[

/* 0 — старт */
async()=>{
  hearts();
  await show(`<div style="font-size:64px" class="heartbeat">🦊</div>
  <h1>Привіт, киць</h1>
  <p>Тут для тебе маленька вікторина.<br>Правило одне: відповідь «ні» <b>не існує</b> 😌</p>
  <p><small>увімкни звук 🔊</small></p>
  <div class="btns"><button class="yes big" id="go">Почати 💌</button></div>`);
  $('#go').onclick=async()=>{
    // розблокувати аудіо на телефоні
    song.volume=1;try{await song.play();song.pause();song.currentTime=0}catch(e){}
    const c=await show(`<p>Музика почнеться через...</p><div id="count">5</div><p class="heartbeat">❤️</p>`);
    for(let n=5;n>=1;n--){const el=$('#count');el.textContent=n;el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick');buzz(15);await sleep(1000)}
    song.play().catch(()=>{});$('#mute').style.display='';
    burst(null,null,['🎵','🎶','❤️','💖','✨'],40);
    next();
  };
},

/* 1 — чихуахуа чи бульдог */
async()=>{
  await show(`<div class="q-num">Питання 1</div><h2>Киць, хто краще: чихуахуа чи бульдог? 🐶</h2>
  <div class="btns"><button class="yes" data-b="chihuahua">Чихуахуа</button><button class="yes" data-b="bulldog/english">Бульдог</button></div><div id="res"></div>`);
  app.querySelectorAll('[data-b]').forEach(b=>b.onclick=async()=>{
    const br=b.dataset.b,chi=br==='chihuahua';
    app.querySelector('.btns').remove();
    $('#res').innerHTML=`<div class="react">шукаю фотку... 🔍</div>`;
    let url=null;try{const r=await fetch(`https://dog.ceo/api/breed/${br}/images/random`);url=(await r.json()).message}catch(e){}
    $('#res').innerHTML=(url?`<img class="photo" src="${url}" alt="">`:`<div style="font-size:120px">${chi?'🐕':'🐶'}</div>`)+
      `<div class="react">${chi?'Маленька, тремтяча і злиться, коли голодна... хм, когось нагадує 😏🦊':'Пухкенький, хропе і любить поїсти — ну це я 😌'}</div>`+nextBtn();
    burst(...centerOf($('#res')),['🐶','🦴','🐾','❤️'],22);wireNext();
  });
},

/* 2 — червоний чи білий */
async()=>{
  await show(`<div class="q-num">Питання 2</div><h2>Як думаєш, шо я виберу: червоний чи білий? 🤔</h2>
  <div class="btns"><button style="background:#e0263f;color:#fff" class="c">🔴 Червоний</button><button class="c">⚪ Білий</button></div><div id="res"></div>`);
  app.querySelectorAll('.c').forEach(b=>b.onclick=async()=>{
    app.querySelector('.btns').remove();
    $('#res').innerHTML=`<div class="react">Неправильно 😌</div>`;await sleep(900);
    $('#res').innerHTML+=`<h1 class="glitch">Я вибираю ТЕБЕ 🫵</h1>
     <div class="polaroid"><img src="${P(3)}" alt=""><span>ось цю 💙👅</span></div>
     <div class="react">(хоча рижий — то технічно червоний 🦊)</div>`+nextBtn();
    rain(['🫵','❤️','😍','🫵','💘','🦊'],2600);burst(null,null,['🫵','❤️','💖'],40);wireNext();
  });
},

/* 3 — шаурма + помилки */
async()=>{
  await show(`<div class="q-num">Питання 3</div><h2>Сходим тріснем по шаурмі? 🌯</h2>
   <div class="btns" id="bb"><button class="yes" id="y">Так 😋</button><button class="ghost" id="runNo">Ні</button></div><div id="res"></div>`);
  const no=$('#runNo'),bb=$('#bb');let escapes=0,errs=0,locked=false;
  const flee=e=>{ if(escapes>=4)return; e&&e.preventDefault(); escapes++;buzz(10);
    const r=bb.getBoundingClientRect();
    no.style.position='fixed';no.style.left=rnd(10,innerWidth-110)+'px';no.style.top=rnd(80,innerHeight-200)+'px';
    no.textContent=pick(['Ні 🏃','не впіймаєш','хі-хі','Ні?']);
  };
  no.addEventListener('pointerenter',flee);
  no.addEventListener('touchstart',e=>{if(escapes<4)flee(e)},{passive:false});
  no.onclick=()=>{ if(escapes<4){flee();return} if(locked)return; locked=true; errorChain(); };
  const msgs=[
    ['Помилка 0xШАУРМА','Відповідь «Ні» не підтримується цим сайтом.<br>Спробуйте ще раз.'],
    ['Критична помилка','Система виявила, що ви голодна. 🌯<br>Відмова неможлива.'],
    ['Error 404','Відповідь «Ні» не знайдено.<br>Спробуйте ще раз.'],
  ];
  function errorChain(){
    no.remove();
    const mk=(title,body,last)=>{const d=document.createElement('div');d.className='err';
      d.style.left=rnd(4,Math.max(5,innerWidth-340))+'px';d.style.top=rnd(90,innerHeight*.45)+'px';
      d.innerHTML=`<div class="bar"><span>⚠️ ${title}</span><button class="x">✕</button></div>
       <div class="body"><div class="ico">${last?'🥺':'❌'}</div><div>${body}</div></div><button class="ok">${last?'Тицяю «так» 💖':'Спробувати ще раз'}</button>`;
      document.body.appendChild(d);buzz([40,40,40]);return d};
    const spawn=()=>{
      if(errs<3){const [t,b]=msgs[errs++];const d=mk(t,b,false);
        d.querySelector('.x').onclick=d.querySelector('.ok').onclick=()=>{spawn()};}
      else{const d=mk('ну киць...','ну киць 🥺 ну бачиш — <b>помилка</b>.<br>Тицяй «так».',true);
        const fin=()=>{document.querySelectorAll('.err').forEach(e=>e.remove());$('#y').classList.add('heartbeat');$('#y').style.fontSize='24px'};
        d.querySelector('.x').onclick=()=>{d.querySelector('.body div:last-child').innerHTML='хрестик теж зламався 🙈<br>тицяй «так»';d.style.animation='none';void d.offsetWidth;d.style.animation='shake .4s';d.querySelector('.x').onclick=fin};
        d.querySelector('.ok').onclick=fin;}
    };spawn();
  }
  $('#y').onclick=()=>{document.querySelectorAll('.err').forEach(e=>e.remove());if(no.isConnected)no.remove();
    $('#bb').remove();
    $('#res').innerHTML=`<h1>Урааа 🎉</h1><div class="react">побачення з шаурмою офіційно заброньоване 🌯❤️<br>тт 💋</div>`+nextBtn();
    rain(['🌯','❤️','💋','🥳','💖'],3000);burst(null,null,['💋','❤️','🌯','💕'],40);wireNext();};
},

/* 4 — хто найкрасивіша */
async()=>{
  await show(`<div class="q-num">Питання 4</div><h2>Хто найкрасивіша дівчина на світі? 👑</h2>
  <div class="btns" style="flex-direction:column">
   <button class="yes" data-p="7">Ти</button>
   <button class="yes" data-p="2">Ти, але сонна 😴</button>
   <button class="yes" data-p="5">Ти, коли серйозна 🧐</button>
   <button class="ghost" id="other">Якась інша</button></div><div id="res"></div>`);
  $('#other').onclick=async e=>{const b=e.currentTarget;b.classList.add('glitch');buzz(60);b.textContent='ЯКАСЬ І̷Н̴Ш̸А̵';await sleep(500);b.textContent='я̴к̷а̸с̵ь̶ ̴т̷и̸';await sleep(500);b.textContent='ТИ 💅 (без варіантів)';b.className='yes';b.dataset.p='8';b.onclick=pickIt};
  const pickIt=e=>{const p=e.currentTarget.dataset.p;app.querySelector('.btns').remove();
    $('#res').innerHTML=`<div class="polaroid"><img src="${P(p)}" alt=""><span>правильна відповідь ✅</span></div><div class="react">100 балів з 100 😍</div>`+nextBtn();
    burst(...centerOf($('#res')),['👑','😍','💖','✨'],30);wireNext();};
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=pickIt);
},

/* 5 — повзунок любові */
async()=>{
  await show(`<div class="q-num">Питання 5</div><h2>Наскільки сильно ти мене любиш?</h2>
   <div id="meterVal">50%</div><input type="range" min="0" max="100" value="50" id="rg"><div class="react" id="mt">тягни 👉</div><div id="res"></div>`);
  const rg=$('#rg'),val=$('#meterVal'),mt=$('#mt');let prev=50,done=false;
  rg.oninput=()=>{ if(done)return; let v=+rg.value;
    if(v<prev){ // вниз не можна
      buzz(30);mt.textContent=pick(['ой, повзунок зламався 🙈','тільки вгору ⬆️','неправильний напрямок 😤','помилка: забагато любові']);
      v=Math.min(100,prev+8);rg.value=v;}
    else mt.textContent=v>80?'майже... 🔥':'ще-ще 👉';
    prev=v;val.textContent=v+'%';val.style.transform=`scale(${1+v/250})`;
    if(v>=100){done=true;rg.disabled=true;
      let n=100;const t=setInterval(()=>{n+=Math.floor(rnd(50,400));val.textContent=n+'%';if(n>3000){clearInterval(t);val.textContent='∞';mt.textContent='так я і думав 😌 я тебе теж ∞';$('#res').innerHTML=nextBtn();wireNext();rain(['♾️','❤️','💖'],2000)}},70);}
  };
},

/* 6 — пазл */
async()=>{
  await show(`<div class="q-num">Питання 6</div><h2>Збери нас докупи 🧩</h2><p><small>тицяй на шматочки, щоб повернути</small></p>
   <div class="puz" id="pz"></div><div class="btns" id="pzb"><button class="ghost" id="giveup">здаюсь 🥺</button></div><div id="res"></div>`);
  const pz=$('#pz'),rot=[];
  for(let i=0;i<9;i++){const t=document.createElement('div');t.className='tile';const x=i%3,y=Math.floor(i/3);
    t.style.backgroundImage=`url(${P(9)})`;t.style.backgroundPosition=`${x*50}% ${y*50}%`;
    rot[i]=[90,180,270][Math.floor(Math.random()*3)];if(i===4)rot[i]=0;t.style.transform=`rotate(${rot[i]}deg)`;
    t.onclick=()=>{if(pz.classList.contains('done'))return;rot[i]+=90;t.style.transform=`rotate(${rot[i]}deg)`;buzz(8);check()};pz.appendChild(t)}
  const tiles=[...pz.children];
  function win(msg){pz.classList.add('done');$('#pzb').remove();
    $('#res').innerHTML=`<div class="react">${msg}</div>`+nextBtn();burst(...centerOf(pz),['🧩','💞','❤️','✨'],34);wireNext()}
  function check(){if(rot.every(r=>r%360===0))win('ми складаємось ідеально 🧩💞')}
  $('#giveup').onclick=()=>{tiles.forEach((t,i)=>{rot[i]=Math.ceil(rot[i]/360)*360||360;t.style.transform=`rotate(${rot[i]}deg)`});setTimeout(()=>win('я зібрав за тебе, бо я завжди буду поруч 🫶'),350)};
},

/* 7 — меморі */
async()=>{
  await show(`<div class="q-num">Питання 7</div><h2>Знайди пари 🃏</h2><p><small>перевіримо, чи впізнаєш себе 😏</small></p><div class="mem" id="mem"></div><div id="res"></div>`);
  const imgs=[3,4,6,8],deck=[...imgs,...imgs].sort(()=>Math.random()-.5),mem=$('#mem');let open=[],found=0,busy=false;
  deck.forEach(p=>{const c=document.createElement('div');c.className='mc';c.dataset.p=p;
    c.innerHTML=`<div class="in"><div class="f">🦊</div><div class="b" style="background-image:url(${P(p)})"></div></div>`;
    c.onclick=async()=>{if(busy||c.classList.contains('flip'))return;c.classList.add('flip');open.push(c);buzz(8);
      if(open.length===2){busy=true;const [a,b]=open;open=[];
        if(a.dataset.p===b.dataset.p){a.classList.add('ok');b.classList.add('ok');burst(...centerOf(b),['💖','✨'],10);found++;busy=false;
          if(found===imgs.length){$('#res').innerHTML=`<div class="react">всі 4 пари! на кожній фотці — найкрасивіша 😍</div>`+nextBtn();wireNext();rain(['🃏','💖','😍'],1800)}}
        else{await sleep(750);a.classList.remove('flip');b.classList.remove('flip');busy=false}}};
    mem.appendChild(c)});
},

/* 8 — поцілунки */
async()=>{
  await show(`<div class="q-num">Питання 8</div><h2>Скільки поцілунків ти мені винна? 💋</h2>
   <div id="kiss">100</div><div class="react" id="kt">чесно-чесно?</div>
   <div class="btns"><button class="ghost" id="less">менше ➖</button><button class="yes" id="ok">чесно ✅</button></div><div id="res"></div>`);
  let k=100;const lines=['ой, порахував неправильно 🤭','калькулятор каже більше','з відсотками 📈','інфляція 💸','за вчора теж треба 😤','ну ти ж сама натиснула'];
  $('#less').onclick=e=>{k=Math.round(k*rnd(1.4,2.1));$('#kiss').textContent=k.toLocaleString('uk');$('#kt').textContent=pick(lines);
    burst(...centerOf($('#kiss')),['💋','😘'],10);buzz(15);const b=e.currentTarget;b.style.transform=`scale(${Math.max(.4,1-k/20000)})`};
  $('#ok').onclick=()=>{app.querySelector('.btns').remove();$('#kt').textContent='віддаси при зустрічі 😘 я записав 📝';$('#res').innerHTML=nextBtn();rain(['💋','😘','💋'],2000);wireNext()};
},

/* 9 — подарунок-купон */
async()=>{
  await show(`<div class="q-num">Питання 9</div><h2>Тут для тебе подаруночок 🎁</h2><p><small>тицьни 3 рази, щоб відкрити</small></p>
   <div id="gift">🎁</div><div id="res"></div>`);
  let taps=0;const g=$('#gift');
  g.onclick=()=>{taps++;g.classList.remove('wob');void g.offsetWidth;g.classList.add('wob');buzz(20);
    if(taps<3){g.textContent=['🎁','📦','🎁'][taps];return}
    g.onclick=null;g.textContent='🎉';burst(...centerOf(g),['🎊','🎉','❤️','✨','🎁'],40);
    $('#res').innerHTML=`<div class="coupon"><b>КУПОН 🎟️</b>на безлімітні обійми, шаурму в будь-який день<br>і на одне «я був неправий» 😅<br><small>термін дії: назавжди</small></div>`+nextBtn('Останнє питання →');wireNext();};
},

/* 10 — фінальне */
async()=>{
  await show(`<div class="q-num">Останнє питання</div><div style="font-size:54px" class="heartbeat">💍</div><h1>Будеш моєю назавжди?</h1>
   <div class="btns" id="fb"><button class="yes" id="fy">Так ❤️</button><button class="ghost" id="fn">Ні</button></div>`);
  let s=1,n=0;const fy=$('#fy'),fn=$('#fn');
  const t=['ти впевнена?','подумай ще 🥺','киць...','ну пліз 🙏','я заплачу 😭','останній шанс','ок, тоді так ❤️'];
  fn.onclick=()=>{buzz(30);s+=.35;fy.style.transform=`scale(${s})`;fn.style.transform=`scale(${Math.max(.5,1-n*.08)})`;fn.textContent=t[Math.min(n,t.length-1)];
    if(n>=t.length-1){fn.className='yes';fn.onclick=finale}n++};
  fy.onclick=finale;
},

];

/* ---------- ФІНАЛ ---------- */
async function finale(){
  stepIdx=TOTAL;hearts();buzz([60,40,60,40,200]);
  rain(['❤️','💖','💕','💘','🦊','💍','✨'],6000);burst(null,null,undefined,60);
  await show(`<h1 class="heartbeat">Я так і знав ❤️</h1>
   <div class="wall" id="wall"></div>
   <p style="font-family:Caveat;font-size:28px;line-height:1.15">Ти — моя найкраща рижа 🦊<br>Дякую, що ти в мене є.<br>Люблю тебе. Тт 💋</p>
   <p><small>подарунок для тебе від мене 💌</small></p>
   <div class="btns"><button class="ghost" id="again">ще раз 🔁</button><button class="yes" id="hug">обійняти 🤗</button></div>`);
  const wall=$('#wall'),caps=['ти 💖','сонна 😴','👅💙','серйозна','ми 🫶','🐹','моя','рижа 🦊','назавжди'];
  const pols=[];for(let i=1;i<=9;i++){const d=document.createElement('div');d.className='polaroid';d.innerHTML=`<img src="${P(i)}" alt=""><span>${caps[i-1]}</span>`;
    d.style.transform='translate(-50%,-50%) scale(0)';wall.appendChild(d);pols.push(d)}
  const shuffle=()=>pols.forEach((d,i)=>{const w=wall.clientWidth;d.style.zIndex=Math.floor(rnd(1,20));
    d.style.transform=`translate(calc(-50% + ${rnd(-w*.28,w*.28)}px),calc(-50% + ${rnd(-wall.clientHeight*.25,wall.clientHeight*.25)}px)) rotate(${rnd(-18,18)}deg) scale(${rnd(.85,1.05)})`});
  pols.forEach((d,i)=>setTimeout(()=>{d.style.transform=`translate(-50%,-50%) rotate(${rnd(-18,18)}deg) scale(1)`;burst(...centerOf(wall),['📸','❤️'],6)},300+i*350));
  setTimeout(shuffle,300+9*350+400);
  pols.forEach(d=>d.onclick=()=>{d.style.zIndex=99;d.style.transform='translate(-50%,-50%) rotate(0) scale(1.35)';burst(...centerOf(d),['😍','❤️'],12)});
  wall.ondblclick=shuffle;
  const iv=setInterval(()=>{if(!document.body.contains(wall))return clearInterval(iv);shuffle()},6000);
  $('#hug').onclick=e=>{burst(...centerOf(e.currentTarget),['🤗','❤️','🫂','💞'],40);e.currentTarget.textContent='обійняв 🫂 тепер твоя черга';buzz(200)};
  $('#again').onclick=()=>{stepIdx=0;STEPS[1]&&(stepIdx=1,hearts(),STEPS[1]())};
}

STEPS[0]();
</script>
